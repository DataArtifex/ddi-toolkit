profile:
  id: cdif
  name: DDI-CDI / CDIF Readiness Profile
  description: Requirements needed to convert DDI-Codebook into DDI-CDI / CDIF RDF.
  version: "1.0"
  target_standard: "DDI-C 2.6"

rules:
  - id: codebook.missing_id
    target: codeBook/@ID
    rule: required
    severity: error
    message: "Codebook has no @ID attribute"

  - id: codebook.missing_filedscr
    target: codeBook/fileDscr
    rule: min_count
    min_count: 1
    severity: error
    message: "Codebook has no FileDscr element"

  - id: codebook.filedscr.missing_id
    context: codeBook/fileDscr
    target: "@ID"
    rule: required
    severity: error
    message: "FileDscr element has no @ID attribute"

  - id: codebook.no_variables
    target: codeBook/dataDscr/var
    rule: min_count
    min_count: 1
    severity: warning
    message: "Codebook has no variables"
