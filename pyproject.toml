[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dartfx-ddi"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = []
authors = [{ name = "kulnor", email = "pascal.heus@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "dartfx-rdf @ git+https://github.com/DataArtifex/rdf-toolkit.git@main",
  "rdflib>=7.1.0",
  "pyshacl",
  "typer",
]

[project.urls]
Documentation = "https://github.com/DataArtifex/dartfx-ddi#readme"
Issues = "https://github.com/DataArtifex/dartfx-ddi/issues"
Source = "https://github.com/DataArtifex/dartfx-ddi"

[project.scripts]
dartfx-ddi = "dartfx.ddi.cli:main"


[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/dartfx"]

[tool.hatch.version]
path = "src/dartfx/ddi/__about__.py"

[dependency-groups]
dev = [
  "coverage[toml]>=7.0.0",
  "pre-commit>=4.0.0",
  "pyrefly>=1.0.0",
  "pytest>=9",
  "python-dotenv>=1.0.0",
  "ruff>=0.3.0",
]
docs = [
  "sphinx>=9.0.0",
  "sphinx-rtd-theme>=3.0.0",
  "myst-parser>=5.0.0",
  "sphinx-copybutton>=0.5.2",
]

[tool.hatch.envs.default]
dependencies = ["dev"]
[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = ["- coverage combine", "coverage report"]
cov = ["test-cov", "cov-report"]

[[tool.hatch.envs.all.matrix]]
python = ["3.12", "3.13"]

[tool.hatch.envs.types]
dependencies = ["dev"]

[tool.hatch.envs.types.scripts]
check = "pyrefly check {args:src tests}"

[tool.hatch.envs.docs]
dependencies = ["docs"]
[tool.hatch.envs.docs.scripts]
build = "sphinx-build -b html docs/source docs/build/html"
serve = "python -m http.server -d docs/build/html"


[tool.coverage.run]
source_pkgs = ["ddi", "tests"]
branch = true
parallel = true
omit = ["src/dartfx/ddi/__about__.py"]

[tool.coverage.paths]
ddi = ["src/dartfx/ddi", "*/dartfx-ddi/src/dartfx/ddi"]
tests = ["tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]
force-exclude = true
exclude = [
  "specifications",
  "tests/data",
  "src/**/model_*.py",
  "src/**/dataclass_model.py",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG", # flake8-unused-arguments
  "PT",  # flake8-pytest-style
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/dartfx/ddi/ddicdi/model_1_0_0.py" = ["E501", "F821"]
"src/dartfx/ddi/ddilifecycle/model_4_0_rc1.py" = ["E501", "F821", "ARG002"]
"src/dartfx/ddi/ddicdi/dataclass_model.py" = ["E501", "E402", "F821", "B008"]
"src/dartfx/ddi/ddicdi/specification.py" = ["E501"]
"src/dartfx/ddi/ddicdi/assistants.py" = ["B010"]
"src/dartfx/ddi/ddicodebook.py" = ["E501"]
"src/dartfx/ddi/utils.py" = ["E501"]
"src/dartfx/ddi/ddicdi/utils.py" = ["E501"]
"lab/*" = ["E501", "E402"]

[tool.hatch.metadata]
allow-direct-references = true


[tool.ruff.lint.isort]
known-first-party = ["dartfx"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
exclude = [
  "specifications",
  "tests/data",
  "src/**/model_*.py",
  "src/**/dataclass_model.py",
]

[tool.pyrefly]
search-path = ["src"]
python-version = "3.12.0"
preset = "legacy"
ignore-missing-imports = ["*"]
